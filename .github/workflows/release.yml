name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            DATE_STR=$(date -u +%Y%m%d)
            echo "tag=build-${DATE_STR}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if ! command -v makensis >/dev/null 2>&1; then
            if [ ! -f "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
              choco install nsis -y --no-progress
            fi
            echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
          fi

      - name: Run tests
        run: cargo test

      - name: Build release binary (Windows / Linux)
        if: matrix.platform != 'macos'
        env:
          RDPMANAGER_VERSION: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release

      - name: Build release binaries (macOS arm64 & amd64)
        if: matrix.platform == 'macos'
        env:
          RDPMANAGER_VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" == "windows" ]; then
            TAG="${{ needs.prepare.outputs.tag }}"
            VI_VER="0.1.0.0"
            if [[ "${TAG}" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              VI_VER="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.0"
            fi
            WIN_PWD=$(cygpath -w "$(pwd)")
            makensis \
              -INPUTCHARSET UTF8 \
              -DAPP_VERSION="${TAG}" \
              -DVI_VERSION="${VI_VER}" \
              -DBIN_PATH="${WIN_PWD}\\target\\release\\rdpmanager.exe" \
              -DOUT_FILE="${WIN_PWD}\\dist\\rdpmanager-windows-amd64-installer.exe" \
              -DICON_PATH="${WIN_PWD}\\assets\\app.ico" \
              installer/windows/rdpmanager.nsi
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            tar -czf dist/rdpmanager-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release rdpmanager
            tar -czf dist/rdpmanager-macos-amd64.tar.gz -C target/x86_64-apple-darwin/release rdpmanager
          else
            tar -czf dist/rdpmanager-linux-amd64.tar.gz -C target/release rdpmanager
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
